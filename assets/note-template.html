<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{DOCUMENT_TITLE}}</title>
  <style>
    :root { --ink:#172033; --muted:#5d687a; --paper:#fff; --bg:#f4f6fa; --line:#dce2ea; --accent:#3157d5; --soft:#edf2ff; --warn:#fff6dc; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:var(--bg); font:16px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    a { color:var(--accent); }
    header { padding:64px 24px 42px; color:#fff; background:linear-gradient(135deg,#182952,#3157d5); }
    header .wrap, main, nav { width:min(960px,calc(100% - 32px)); margin:auto; }
    h1 { margin:0 0 12px; font-size:clamp(2rem,6vw,3.7rem); line-height:1.15; }
    .subtitle { max-width:760px; margin:0; color:#dfe7ff; font-size:1.08rem; }
    nav { margin-top:-18px; padding:18px 22px; background:var(--paper); border:1px solid var(--line); border-radius:14px; box-shadow:0 12px 28px #17203314; }
    nav strong { display:block; margin-bottom:7px; }
    nav ol { margin:0; padding-left:22px; columns:2; }
    main { padding:30px 0 72px; }
    section { margin:22px 0; padding:30px; background:var(--paper); border:1px solid var(--line); border-radius:14px; }
    h2 { margin:0 0 18px; font-size:1.65rem; line-height:1.3; }
    h3 { margin-top:28px; font-size:1.16rem; }
    .summary { background:var(--soft); border-left:5px solid var(--accent); }
    .note { padding:14px 16px; background:var(--warn); border-radius:9px; }
    table { width:100%; border-collapse:collapse; margin:18px 0; font-size:.95rem; }
    th,td { padding:11px 12px; border:1px solid var(--line); text-align:left; vertical-align:top; }
    th { background:#f6f8fb; }
    footer { padding:26px; color:var(--muted); text-align:center; }
    @media (max-width:680px) { header{padding-top:42px} nav ol{columns:1} section{padding:22px 18px} table{display:block;overflow-x:auto} }
    @media print { body{background:#fff} nav,section{box-shadow:none} section{break-inside:avoid} }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>{{DOCUMENT_TITLE}}</h1>
      <p class="subtitle">{{DOCUMENT_SUBTITLE}}</p>
    </div>
  </header>
  <nav aria-label="目录">
    <strong>目录</strong>
    <ol>
      <li><a href="#summary">重点总结</a></li>
      <li><a href="#chapter-1">{{CHAPTER_1_TITLE}}</a></li>
      <!-- 按已确认的大纲增删目录项，确保 href 与章节 id 一致。 -->
    </ol>
  </nav>
  <main>
    <section id="summary" class="summary">
      <h2>重点总结</h2>
      <ul>
        <li>{{KEY_TAKEAWAY}}</li>
      </ul>
    </section>
    <section id="chapter-1">
      <h2>{{CHAPTER_1_TITLE}}</h2>
      <h3>{{SECTION_TITLE}}</h3>
      <p>{{SECTION_CONTENT}}</p>
      <div class="note"><strong>学习提醒</strong><br>{{NOTE_CONTENT}}</div>
    </section>
    <!-- 复制 section，并按照已确认的大纲生成剩余章节。 -->
  </main>
  <footer>根据课程材料整理 · {{UPDATED_DATE}}</footer>
</body>
</html>
